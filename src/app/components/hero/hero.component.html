<section id="home" class="relative min-h-screen flex items-center overflow-hidden bg-[#050d1f]">
	<!-- Particle canvas -->
	<canvas #canvas class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

	<!-- Background glows -->
	<div
		class="absolute top-0 right-0 w-[700px] h-[700px] bg-cyan-500/5 rounded-full blur-[140px] pointer-events-none z-0">
	</div>
	<div
		class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-blue-700/5 rounded-full blur-[120px] pointer-events-none z-0">
	</div>

	<!-- Grid overlay -->
	<div class="absolute inset-0 bg-grid opacity-40 pointer-events-none z-0"></div>

	<!-- Content -->
	<div class="relative z-10 max-w-7xl mx-auto px-6 pt-28 pb-20 w-full">
		<div class="grid lg:grid-cols-2 gap-14 items-center min-h-[calc(100vh-7rem)]">

			<!-- ── Text column ─────────────────────────────── -->
			<div class="space-y-7 order-2 lg:order-1">

				<p class="hero-greeting font-mono text-cyan-400 text-base tracking-widest uppercase">
					&gt; {{ t().greeting }}
				</p>

				<h1 class="hero-name font-black leading-[1.1]">
					<span class="block text-5xl md:text-6xl xl:text-7xl text-white">Jean Pierre</span>
					<span
						class="block text-4xl md:text-5xl xl:text-6xl bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-400 bg-clip-text text-transparent">
						Sotamba Acosta
					</span>
				</h1>

				<div
					class="hero-role flex items-center gap-2 text-xl md:text-2xl font-semibold text-slate-300 min-h-[2rem]">
					<span class="text-cyan-400 font-mono">&lt;</span>
					<span #typedEl class="font-mono text-slate-200"></span>
					<span class="text-cyan-400 font-mono">/&gt;</span>
				</div>

				<p class="hero-description text-slate-400 text-base md:text-lg leading-relaxed max-w-xl">
					{{ t().description }}
				</p>

				<!-- CTAs -->
				<div class="flex flex-wrap gap-4">
					<button
						class="hero-cta-btn group inline-flex items-center justify-center px-7 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-semibold text-sm hover:shadow-xl hover:shadow-cyan-500/25 transition-all duration-300 hover:-translate-y-0.5 active:scale-95"
						(click)="scrollToSection('about')">
						{{ t().cta }}
						<lucide-icon [img]="ArrowRight"
							class="ml-2 h-4 w-4 group-hover:translate-x-1 transition-transform"></lucide-icon>
					</button>
					<button
						class="hero-cta-btn inline-flex items-center justify-center px-7 py-3 rounded-xl border border-slate-600/70 text-slate-300 font-semibold text-sm hover:border-cyan-500/60 hover:text-cyan-400 hover:bg-cyan-500/5 transition-all duration-300 active:scale-95"
						(click)="scrollToSection('contact')">
						<lucide-icon [img]="Download" class="mr-2 h-4 w-4"></lucide-icon>
						{{ t().downloadCV }}
					</button>
				</div>

				<!-- Tech badges -->
				<div class="flex flex-wrap gap-2 pt-1">
					<span *ngFor="let badge of techBadges"
						class="hero-badge px-3 py-1 rounded-full bg-slate-800/60 border border-slate-700/50 text-slate-400 text-xs font-mono backdrop-blur-sm hover:border-cyan-500/50 hover:text-cyan-400 hover:bg-cyan-500/5 transition-all duration-200 cursor-default">
						{{ badge }}
					</span>
				</div>
			</div>

			<!-- ── Avatar column ───────────────────────────── -->
			<div class="hero-avatar-wrap relative flex justify-center items-center order-1 lg:order-2">
				<div class="relative w-72 h-72 md:w-80 md:h-80">

					<!-- Outer glow -->
					<div
						class="absolute inset-0 rounded-full bg-gradient-to-br from-cyan-500/15 via-blue-600/10 to-indigo-600/15 blur-3xl scale-125">
					</div>

					<!-- Rotating rings -->
					<div
						class="absolute inset-0 rounded-full border border-dashed border-cyan-500/20 animate-spin-slow">
					</div>
					<div class="absolute inset-6 rounded-full border border-blue-500/15 animate-spin-reverse"></div>

					<!-- Profile image frame -->
					<div
						class="absolute inset-8 rounded-full overflow-hidden border-2 border-cyan-500/30 shadow-2xl shadow-cyan-900/40 bg-gradient-to-br from-slate-800 to-slate-900">
						<img src="/assets/images/profile.jpg" alt="Jean Pierre Sotamba Acosta"
							class="w-full h-full object-cover"
							(error)="$any($event.target).style.display='none'; $any($event.target).nextElementSibling.style.display='flex'" />
						<div class="hidden w-full h-full items-center justify-center select-none">
							<span
								class="text-7xl font-black bg-gradient-to-br from-cyan-400 to-blue-500 bg-clip-text text-transparent">JP</span>
						</div>
					</div>

					<!-- Orbit badges -->
					<div
						class="absolute -top-3 right-0 px-3 py-1.5 glass rounded-full text-xs font-mono text-cyan-400 animate-float shadow-lg shadow-cyan-900/30">
						☁️ Azure / AWS
					</div>
					<div
						class="absolute -bottom-3 left-2 px-3 py-1.5 glass rounded-full text-xs font-mono text-orange-400 animate-float-delayed shadow-lg">
						☕ Java 21
					</div>
					<div
						class="absolute top-1/2 -right-10 -translate-y-1/2 px-3 py-1.5 glass rounded-full text-xs font-mono text-green-400 animate-float-slow shadow-lg">
						🌿 Spring
					</div>
					<div
						class="absolute top-1/2 -left-12 -translate-y-1/2 px-3 py-1.5 glass rounded-full text-xs font-mono text-red-400 animate-float shadow-lg">
						△ Angular
					</div>
				</div>
			</div>

		</div>
	</div>

	<!-- Scroll indicator -->
	<div
		class="hero-scroll absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-1.5 text-slate-600 text-xs font-mono animate-bounce">
		<span>scroll</span>
		<lucide-icon [img]="ChevronDown" class="h-4 w-4"></lucide-icon>
	</div>
</section>
