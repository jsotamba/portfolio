<section id="home" class="min-h-screen flex items-center pt-20 px-6">
  <div class="max-w-7xl mx-auto w-full">
    <div class="grid md:grid-cols-2 gap-12 items-center">
      <!-- Foto Profilo -->
      <div class="relative">
        <div class="w-80 h-80 mx-auto relative">
          <div class="absolute inset-0 bg-gradient-to-br from-cyan-500/20 to-blue-500/20 rounded-full blur-3xl animate-pulse"></div>
          <div class="relative w-full h-full rounded-full overflow-hidden border-4 border-cyan-500/50 shadow-2xl">
            <img
              src="/assets/images/profile.jpg"
              [alt]="t().name"
              class="w-full h-full object-cover"
            />
          </div>
        </div>
      </div>

      <!-- Testo Introduzione -->
      <div class="space-y-6">
        <div class="space-y-2">
          <p class="text-lg text-cyan-500 font-medium">{{ t().greeting }}</p>
          <h1 class="text-5xl md:text-6xl font-bold bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-500 bg-clip-text text-transparent">
            {{ t().name }}
          </h1>
          <h2 class="text-3xl md:text-4xl font-semibold text-slate-700 dark:text-slate-300">
            {{ t().role }}
          </h2>
        </div>

        <p class="text-lg text-slate-600 dark:text-slate-400 leading-relaxed">
          {{ t().description }}
        </p>

        <!-- CTA Buttons -->
        <div class="flex flex-wrap gap-4">
          <button
            (click)="scrollToSection('about')"
            class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors h-11 px-8 bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-600 hover:to-blue-600 text-white"
          >
            {{ t().cta }}
            <lucide-icon [img]="ArrowRight" class="ml-2 h-5 w-5"></lucide-icon>
          </button>
          <button
            (click)="scrollToSection('contact')"
            class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors h-11 px-8 border border-input bg-background hover:bg-accent hover:text-accent-foreground"
          >
            <lucide-icon [img]="Download" class="mr-2 h-5 w-5"></lucide-icon>
            {{ t().downloadCV }}
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
