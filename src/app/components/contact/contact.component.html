<section id="contact" class="py-28 px-6 bg-[#070e1f] relative overflow-hidden">
	<!-- Accent lines -->
	<div
		class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-1 bg-gradient-to-r from-transparent via-cyan-500/50 to-transparent">
	</div>
	<div class="absolute inset-0 bg-dots opacity-20 pointer-events-none"></div>

	<div class="max-w-5xl mx-auto">

		<!-- Header -->
		<div class="text-center mb-16">
			<p class="font-mono text-cyan-400 text-sm tracking-widest uppercase mb-3">// contact.me</p>
			<h2
				class="text-4xl md:text-5xl font-black mb-3 bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-400 bg-clip-text text-transparent">
				{{ t().title }}
			</h2>
			<p class="text-slate-400 text-lg max-w-xl mx-auto">{{ t().subtitle }}</p>
		</div>

		<div class="grid md:grid-cols-2 gap-12">

			<!-- Contact Form -->
			<div class="glass rounded-2xl border border-slate-700/30 p-8">
				<form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="space-y-5">
					<div>
						<input type="text" [(ngModel)]="formData.name" name="name" [placeholder]="t().form.name"
							required
							class="w-full h-12 px-4 rounded-xl bg-slate-800/60 border border-slate-700/50 text-slate-200 placeholder:text-slate-500 text-sm focus:outline-none focus:border-cyan-500/60 focus:ring-1 focus:ring-cyan-500/30 transition-all" />
					</div>
					<div>
						<input type="email" [(ngModel)]="formData.email" name="email" [placeholder]="t().form.email"
							required
							class="w-full h-12 px-4 rounded-xl bg-slate-800/60 border border-slate-700/50 text-slate-200 placeholder:text-slate-500 text-sm focus:outline-none focus:border-cyan-500/60 focus:ring-1 focus:ring-cyan-500/30 transition-all" />
					</div>
					<div>
						<textarea [(ngModel)]="formData.message" name="message" [placeholder]="t().form.message"
							required rows="5"
							class="w-full px-4 py-3 rounded-xl bg-slate-800/60 border border-slate-700/50 text-slate-200 placeholder:text-slate-500 text-sm focus:outline-none focus:border-cyan-500/60 focus:ring-1 focus:ring-cyan-500/30 transition-all resize-none"></textarea>
					</div>
					<button type="submit" [disabled]="!contactForm.valid"
						class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-semibold text-sm hover:shadow-lg hover:shadow-cyan-500/25 transition-all duration-200 hover:-translate-y-0.5 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:translate-y-0">
						<lucide-icon [img]="Send" class="h-4 w-4"></lucide-icon>
						{{ t().form.send }}
					</button>
				</form>
			</div>

			<!-- Social + CV -->
			<div class="space-y-10">

				<!-- Social links -->
				<div>
					<p class="font-mono text-cyan-400 text-xs uppercase tracking-widest mb-5">{{ t().social }}</p>
					<div class="flex gap-4">
						<a *ngFor="let social of socialLinks" [href]="social.url" target="_blank"
							rel="noopener noreferrer"
							class="group inline-flex items-center gap-3 px-5 py-3 glass rounded-xl border border-slate-700/30 text-slate-300 hover:border-cyan-500/40 hover:text-cyan-400 transition-all duration-200">
							<lucide-icon [img]="getIcon(social.icon)" class="h-5 w-5"></lucide-icon>
							<span class="text-sm font-medium">{{ social.name }}</span>
						</a>
					</div>
				</div>

				<!-- CV download -->
				<div>
					<p class="font-mono text-cyan-400 text-xs uppercase tracking-widest mb-5">{{ t().cvSection }}</p>
					<div class="space-y-3">
						<button *ngFor="let cv of cvLinks" (click)="downloadCV(cv)"
							class="w-full inline-flex items-center gap-3 px-5 py-3 glass rounded-xl border border-slate-700/30 text-slate-300 hover:border-blue-500/40 hover:text-blue-400 transition-all duration-200 text-sm font-medium">
							<lucide-icon [img]="FileDown" class="h-4 w-4"></lucide-icon>
							CV {{ cv.label }}
						</button>
					</div>
				</div>

			</div>
		</div>
	</div>
</section>
