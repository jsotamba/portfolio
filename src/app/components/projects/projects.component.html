<section id="projects" class="py-28 px-6 bg-[#050d1f] relative overflow-hidden">
	<!-- Accent line -->
	<div
		class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-1 bg-gradient-to-r from-transparent via-purple-500/50 to-transparent">
	</div>
	<div class="absolute inset-0 bg-grid opacity-20 pointer-events-none"></div>

	<div class="max-w-6xl mx-auto">

		<!-- Header -->
		<div class="text-center mb-16">
			<p class="font-mono text-cyan-400 text-sm tracking-widest uppercase mb-3">// featured.projects</p>
			<h2
				class="text-4xl md:text-5xl font-black mb-3 bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-400 bg-clip-text text-transparent">
				{{ t().title }}
			</h2>
			<p class="text-slate-400 text-lg">{{ t().subtitle }}</p>
		</div>

		<!-- Project grid -->
		<div class="grid md:grid-cols-2 gap-8">
			<div *ngFor="let project of projects"
				class="project-card group glass rounded-2xl border border-slate-700/30 overflow-hidden hover:border-slate-600/50 transition-all duration-400 hover:-translate-y-1 hover:shadow-2xl hover:shadow-black/40">
				<!-- Image area -->
				<div class="relative h-52 overflow-hidden">
					<img [src]="project.image" [alt]="project.title"
						class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
					<div class="absolute inset-0 bg-gradient-to-t from-[#050d1f] via-[#050d1f]/40 to-transparent"></div>

					<!-- Sector tag -->
					<div *ngIf="project['sector']"
						class="absolute top-4 left-4 px-3 py-1 rounded-full bg-slate-900/90 border border-cyan-500/30 text-xs font-mono text-cyan-400 backdrop-blur-sm">
						{{ project['sector'] }}
					</div>
				</div>

				<!-- Content -->
				<div class="p-6">
					<h3 class="text-xl font-bold text-white mb-2 group-hover:text-cyan-400 transition-colors">
						{{ project.title }}
					</h3>

					<p class="text-slate-400 text-sm leading-relaxed mb-4">
						{{ getDescription(project) }}
					</p>

					<!-- Tech badges -->
					<div class="flex flex-wrap gap-2 mb-6">
						<span *ngFor="let tech of project.technologies"
							class="px-2 py-0.5 rounded text-xs font-mono border border-slate-700/50 bg-slate-800/40 text-slate-400">
							{{ tech }}
						</span>
					</div>

					<!-- Actions -->
					<div class="flex gap-3">
						<a [href]="project.demo" target="_blank" rel="noopener noreferrer"
							class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white text-sm font-medium hover:shadow-lg hover:shadow-cyan-500/25 transition-all duration-200 hover:-translate-y-0.5">
							<lucide-icon [img]="ExternalLink" class="h-4 w-4"></lucide-icon>
							{{ t().viewProject }}
						</a>
						<a [href]="project.github" target="_blank" rel="noopener noreferrer"
							class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-slate-700/50 text-slate-300 text-sm font-medium hover:border-slate-500 hover:text-white transition-all duration-200">
							<lucide-icon [img]="Github" class="h-4 w-4"></lucide-icon>
							{{ t().viewCode }}
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
