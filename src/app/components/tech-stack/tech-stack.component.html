<section id="tech" class="py-24 px-6">
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-16">
      <h2 class="text-4xl md:text-5xl font-bold mb-4 bg-gradient-to-r from-cyan-500 to-blue-500 bg-clip-text text-transparent">
        {{ t().title }}
      </h2>
      <p class="text-slate-600 dark:text-slate-400 text-lg">{{ t().subtitle }}</p>
    </div>

    <div class="space-y-12">
      <div *ngFor="let category of techStack">
        <h3 class="text-2xl font-semibold mb-6 text-slate-800 dark:text-slate-200">
          {{ getCategoryName(category.category) }}
        </h3>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-6">
          <div
            *ngFor="let tech of category.items"
            class="p-6 text-center rounded-lg border-2 bg-card hover:shadow-xl transition-all hover:-translate-y-2 cursor-pointer group hover:border-cyan-500"
          >
            <div class="flex justify-center mb-3">
              <div class="p-4 rounded-full bg-slate-100 dark:bg-slate-800 group-hover:scale-110 transition-transform">
                <lucide-icon
                  [img]="getIcon(tech.icon)"
                  class="h-8 w-8"
                  [style.color]="tech.color"
                ></lucide-icon>
              </div>
            </div>
            <div class="font-semibold text-slate-700 dark:text-slate-300">
              {{ tech.name }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
