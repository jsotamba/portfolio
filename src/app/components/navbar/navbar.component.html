<nav [class]="'fixed top-0 left-0 right-0 z-50 transition-all duration-500 ' + 
    (scrolled 
      ? 'bg-[#050d1f]/90 backdrop-blur-xl border-b border-slate-800/50 shadow-xl shadow-black/20' 
      : 'bg-transparent')">
	<div class="max-w-7xl mx-auto px-6 py-4">
		<div class="flex items-center justify-between">
			<!-- Logo -->
			<div class="text-xl font-black font-mono bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent cursor-pointer hover:opacity-80 transition-opacity"
				(click)="scrollToSection('home')">
				&lt;JP /&gt;
			</div>

			<!-- Navigation Links -->
			<div class="hidden md:flex items-center gap-6">
				<button (click)="scrollToSection('home')"
					class="text-slate-400 hover:text-cyan-400 transition-colors text-sm font-medium">
					{{ t().home }}
				</button>
				<button (click)="scrollToSection('about')"
					class="text-slate-400 hover:text-cyan-400 transition-colors text-sm font-medium">
					{{ t().about }}
				</button>
				<button (click)="scrollToSection('tech')"
					class="text-slate-400 hover:text-cyan-400 transition-colors text-sm font-medium">
					{{ t().tech }}
				</button>
				<button (click)="scrollToSection('experience')"
					class="text-slate-400 hover:text-cyan-400 transition-colors text-sm font-medium">
					{{ t().experience }}
				</button>
				<button (click)="scrollToSection('projects')"
					class="text-slate-400 hover:text-cyan-400 transition-colors text-sm font-medium">
					{{ t().projects }}
				</button>
				<button (click)="scrollToSection('contact')"
					class="px-4 py-2 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 text-white text-sm font-medium hover:shadow-lg hover:shadow-cyan-500/25 transition-all duration-200">
					{{ t().contact }}
				</button>
			</div>

			<!-- Theme & Language Switchers -->
			<div class="flex items-center gap-2">
				<!-- Language Dropdown -->
				<div class="relative">
					<button (click)="toggleLangDropdown()"
						class="inline-flex items-center justify-center rounded-xl border border-slate-700/50 bg-slate-800/50 h-9 w-9 hover:border-cyan-500/40 hover:text-cyan-400 transition-all text-slate-400">
						<lucide-icon [img]="Globe" class="h-4 w-4"></lucide-icon>
					</button>

					<div *ngIf="showLangDropdown"
						class="absolute right-0 mt-2 w-44 rounded-xl shadow-2xl shadow-black/50 bg-[#0a1628] border border-slate-700/50 z-50 overflow-hidden">
						<div class="py-1">
							<button *ngFor="let lang of languages" (click)="setLanguage(lang.code)" [class]="'block w-full text-left px-4 py-2.5 text-sm transition-colors ' +
                  (languageService.language() === lang.code 
                    ? 'bg-cyan-500/10 text-cyan-400' 
                    : 'text-slate-300 hover:bg-slate-800/60')">
								<span class="mr-2">{{ lang.flag }}</span>
								{{ lang.label }}
							</button>
						</div>
					</div>
				</div>

				<!-- Theme Toggle -->
				<button (click)="toggleTheme()"
					class="inline-flex items-center justify-center rounded-xl border border-slate-700/50 bg-slate-800/50 h-9 w-9 hover:border-cyan-500/40 hover:text-cyan-400 transition-all text-slate-400">
					<lucide-icon *ngIf="themeService.theme() === 'dark'" [img]="Sun" class="h-4 w-4"></lucide-icon>
					<lucide-icon *ngIf="themeService.theme() === 'light'" [img]="Moon" class="h-4 w-4"></lucide-icon>
				</button>
			</div>
		</div>
	</div>
</nav>
