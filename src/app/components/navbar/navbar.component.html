<nav
  [class]="'fixed top-0 left-0 right-0 z-50 transition-all duration-300 ' + 
    (scrolled 
      ? 'bg-white/80 dark:bg-slate-950/80 backdrop-blur-lg shadow-lg' 
      : 'bg-transparent')"
>
  <div class="max-w-7xl mx-auto px-6 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <div
        class="text-2xl font-bold bg-gradient-to-r from-cyan-500 to-blue-500 bg-clip-text text-transparent cursor-pointer"
        (click)="scrollToSection('home')"
      >
        &lt;JP /&gt;
      </div>

      <!-- Navigation Links -->
      <div class="hidden md:flex items-center gap-8">
        <button
          (click)="scrollToSection('home')"
          class="text-slate-700 dark:text-slate-300 hover:text-cyan-500 dark:hover:text-cyan-400 transition-colors"
        >
          {{ t().home }}
        </button>
        <button
          (click)="scrollToSection('about')"
          class="text-slate-700 dark:text-slate-300 hover:text-cyan-500 dark:hover:text-cyan-400 transition-colors"
        >
          {{ t().about }}
        </button>
        <button
          (click)="scrollToSection('tech')"
          class="text-slate-700 dark:text-slate-300 hover:text-cyan-500 dark:hover:text-cyan-400 transition-colors"
        >
          {{ t().tech }}
        </button>
        <button
          (click)="scrollToSection('experience')"
          class="text-slate-700 dark:text-slate-300 hover:text-cyan-500 dark:hover:text-cyan-400 transition-colors"
        >
          {{ t().experience }}
        </button>
        <button
          (click)="scrollToSection('projects')"
          class="text-slate-700 dark:text-slate-300 hover:text-cyan-500 dark:hover:text-cyan-400 transition-colors"
        >
          {{ t().projects }}
        </button>
        <button
          (click)="scrollToSection('contact')"
          class="text-slate-700 dark:text-slate-300 hover:text-cyan-500 dark:hover:text-cyan-400 transition-colors"
        >
          {{ t().contact }}
        </button>
      </div>

      <!-- Theme & Language Switchers -->
      <div class="flex items-center gap-3">
        <!-- Language Dropdown -->
        <div class="relative">
          <button
            (click)="toggleLangDropdown()"
            class="inline-flex items-center justify-center rounded-full border border-input bg-background h-10 w-10 hover:bg-accent hover:text-accent-foreground transition-colors"
          >
            <lucide-icon [img]="Globe" class="h-5 w-5"></lucide-icon>
          </button>
          
          <div
            *ngIf="showLangDropdown"
            class="absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white dark:bg-slate-800 ring-1 ring-black ring-opacity-5 z-50"
          >
            <div class="py-1">
              <button
                *ngFor="let lang of languages"
                (click)="setLanguage(lang.code)"
                [class]="'block w-full text-left px-4 py-2 text-sm transition-colors ' +
                  (languageService.language() === lang.code 
                    ? 'bg-cyan-50 dark:bg-cyan-950 text-cyan-600 dark:text-cyan-400' 
                    : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700')"
              >
                <span class="mr-2">{{ lang.flag }}</span>
                {{ lang.label }}
              </button>
            </div>
          </div>
        </div>

        <!-- Theme Toggle -->
        <button
          (click)="toggleTheme()"
          class="inline-flex items-center justify-center rounded-full border border-input bg-background h-10 w-10 hover:bg-accent hover:text-accent-foreground transition-colors"
        >
          <lucide-icon
            *ngIf="themeService.theme() === 'dark'"
            [img]="Sun"
            class="h-5 w-5"
          ></lucide-icon>
          <lucide-icon
            *ngIf="themeService.theme() === 'light'"
            [img]="Moon"
            class="h-5 w-5"
          ></lucide-icon>
        </button>
      </div>
    </div>
  </div>
</nav>
