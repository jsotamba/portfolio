<section id="experience" class="py-24 px-6 bg-slate-50 dark:bg-slate-900/50">
  <div class="max-w-5xl mx-auto">
    <div class="text-center mb-16">
      <h2 class="text-4xl md:text-5xl font-bold mb-4 bg-gradient-to-r from-cyan-500 to-blue-500 bg-clip-text text-transparent">
        {{ t().title }}
      </h2>
      <p class="text-slate-600 dark:text-slate-400 text-lg">{{ t().subtitle }}</p>
    </div>

    <div class="relative">
      <div class="absolute left-8 top-0 bottom-0 w-0.5 bg-gradient-to-b from-cyan-500 to-blue-500"></div>

      <div class="space-y-12">
        <div *ngFor="let exp of experiences" class="relative pl-20">
          <div class="absolute left-5 top-6 w-6 h-6 rounded-full bg-cyan-500 border-4 border-white dark:border-slate-950 shadow-lg"></div>

          <div class="rounded-lg border bg-card p-6 hover:shadow-xl transition-all border-l-4 border-l-cyan-500">
            <div class="flex flex-wrap justify-between items-start mb-3">
              <div>
                <h3 class="text-xl font-bold text-slate-800 dark:text-slate-200">
                  {{ exp.title }}
                </h3>
                <p class="text-lg text-cyan-600 dark:text-cyan-400 font-medium">
                  {{ exp.company }}
                </p>
              </div>
              <span class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors text-slate-600 dark:text-slate-400">
                {{ formatDate(exp.period.start) }} - {{ formatDate(exp.period.end) }}
              </span>
            </div>

            <p class="text-slate-600 dark:text-slate-400 flex items-center gap-2 mb-4">
              <lucide-icon [img]="MapPin" class="h-4 w-4"></lucide-icon>
              {{ exp.location }}
            </p>

            <p class="text-slate-700 dark:text-slate-300 mb-4">
              {{ getDescription(exp) }}
            </p>

            <div class="flex flex-wrap gap-2">
              <span
                *ngFor="let tech of exp.technologies"
                class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors border-transparent bg-secondary text-secondary-foreground hover:bg-secondary/80"
              >
                {{ tech }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
