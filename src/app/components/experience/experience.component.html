<section id="experience" class="py-28 px-6 bg-[#050d1f] relative overflow-hidden">
	<!-- Section top accent -->
	<div
		class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-1 bg-gradient-to-r from-transparent via-blue-500/50 to-transparent">
	</div>
	<div class="absolute inset-0 bg-grid opacity-20 pointer-events-none"></div>

	<div class="max-w-4xl mx-auto">

		<!-- Header -->
		<div class="text-center mb-20">
			<p class="font-mono text-cyan-400 text-sm tracking-widest uppercase mb-3">// career.path</p>
			<h2
				class="text-4xl md:text-5xl font-black mb-3 bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-400 bg-clip-text text-transparent">
				{{ t().title }}
			</h2>
			<p class="text-slate-400 text-lg">{{ t().subtitle }}</p>
		</div>

		<!-- Timeline -->
		<div class="relative">
			<!-- Vertical line -->
			<div class="timeline-line absolute left-6 top-2 bottom-2 w-0.5 rounded-full"></div>

			<div class="space-y-8">
				<div *ngFor="let exp of experiences" #expCard class="exp-card relative pl-16">
					<!-- Timeline dot -->
					<div class="absolute left-3 top-7 w-6 h-6 rounded-full border-2 border-[#050d1f] shadow-lg flex items-center justify-center"
						[style.background]="exp.accentColor ?? '#06b6d4'"
						[style.box-shadow]="'0 0 12px ' + (exp.accentColor ?? '#06b6d4') + '40'">
						<div class="w-2 h-2 rounded-full bg-[#050d1f]"></div>
					</div>

					<!-- Card -->
					<div class="glass rounded-2xl border border-slate-700/30 overflow-hidden transition-all duration-300 hover:border-slate-600/50"
						[style.border-left]="'3px solid ' + (exp.accentColor ?? '#06b6d4')">
						<!-- Card header (always visible) -->
						<div class="p-6">
							<div class="flex flex-wrap items-start justify-between gap-4 mb-4">
								<div>
									<!-- Current badge -->
									<span *ngIf="isCurrentRole(exp)"
										class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 mb-2">●
										Presente</span>

									<h3 class="text-xl font-bold text-white">{{ exp.title }}</h3>
									<p class="font-semibold mt-0.5" [style.color]="exp.accentColor ?? '#06b6d4'">
										{{ exp.company }}
									</p>
								</div>

								<div class="text-right">
									<span
										class="inline-block px-3 py-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50 text-xs font-mono text-slate-300">
										{{ formatDate(exp.period.start) }} — {{ formatDate(exp.period.end) }}
									</span>
								</div>
							</div>

							<div class="flex flex-wrap gap-3 text-xs text-slate-400 mb-4">
								<span class="flex items-center gap-1.5">
									<lucide-icon [img]="MapPin" class="h-3 w-3"></lucide-icon>
									{{ exp.location }}
								</span>
								<span *ngIf="exp.sector" class="flex items-center gap-1.5">
									<span class="w-1 h-1 rounded-full bg-slate-600 inline-block"></span>
									{{ exp.sector }}
								</span>
							</div>

							<p class="text-slate-400 text-sm leading-relaxed mb-4">
								{{ getDescription(exp) }}
							</p>

							<!-- Tech badges -->
							<div class="flex flex-wrap gap-2 mb-4">
								<span *ngFor="let tech of exp.technologies"
									class="px-2.5 py-1 rounded-lg text-xs font-mono border border-slate-700/50 bg-slate-800/40 text-slate-300 hover:border-cyan-500/40 hover:text-cyan-400 transition-colors">
									{{ tech }}
								</span>
							</div>

							<!-- Toggle key activities -->
							<button *ngIf="exp.keyActivities && exp.keyActivities.length > 0"
								(click)="toggleExpand(exp.id)"
								class="inline-flex items-center gap-1.5 text-xs font-mono text-cyan-400 hover:text-cyan-300 transition-colors">
								<lucide-icon [img]="isExpanded(exp.id) ? ChevronUp : ChevronDown"
									class="h-3.5 w-3.5"></lucide-icon>
								{{ isExpanded(exp.id) ? 'Nascondi' : t().keyActivities }}
							</button>
						</div>

						<!-- Key activities (expandable) -->
						<div *ngIf="isExpanded(exp.id) && exp.keyActivities"
							class="px-6 pb-5 border-t border-slate-700/30">
							<ul class="mt-4 space-y-2">
								<li *ngFor="let activity of exp.keyActivities"
									class="flex items-start gap-3 text-sm text-slate-400">
									<span class="mt-1.5 w-1.5 h-1.5 rounded-full flex-shrink-0"
										[style.background]="exp.accentColor ?? '#06b6d4'"></span>
									{{ activity }}
								</li>
							</ul>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
